{% extends 'tiendaApp/base.html' %}

{% block title %}
Agregar Producto
{% endblock %}

{% block content %}

<section class="formulario-producto">

    <h2>
        Agregar Nuevo Producto
    </h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <input
            type="text"
            name="nombre"
            placeholder="Nombre del producto"
            required
        >

        <input
            type="number"
            name="precio"
            placeholder="Precio"
            required
        >

        <textarea
            name="descripcion"
            placeholder="Descripción del producto"
            required
        ></textarea>

        <input
            type="file"
            name="imagen"
            required
        >

        <button type="submit">
            Guardar Producto
        </button>

    </form>

</section>

{% endblock %}
