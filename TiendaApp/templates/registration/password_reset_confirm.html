{% extends 'tiendaApp/base.html' %}

{% block title %}
Nueva contraseña
{% endblock %}

{% block content %}

<section class="auth-container">

    <form method="POST" class="auth-form">

        {% csrf_token %}

        <h2>Nueva contraseña</h2>

        <p class="auth-sub">
            Elige una contraseña segura para tu cuenta.
        </p>

        {{ form.as_p }}

        <button type="submit">
            Guardar contraseña
        </button>

    </form>

</section>

{% endblock %}
